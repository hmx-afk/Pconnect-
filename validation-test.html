<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PConnect Validation Test Suite</title>

</head><body><h2>PConnect Input Validation Test Suite</h2>

<button id="emptyBtn">
    Test Empty Details
</button>

<br><br>

<button id="validBtn">
    Test 2000 Characters
</button>

<br><br>

<button id="tooLongBtn">
    Test 2001 Characters
</button>

<br><br>

<pre id="result"></pre>


<script>

    const result =
        document.getElementById("result");


    // ==========================================
    // RUN VALIDATION TEST
    // ==========================================

    async function runTest(details, testName) {

        result.textContent =
            testName + "\n\nTesting...";

        try {

            const response =
                await fetch(
                    "https://pconnect-rho.vercel.app/api/test-validation",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                details: details
                            })
                    }
                );


            const text =
                await response.text();


            result.textContent =
                testName +
                "\n\n" +
                "HTTP Status: " +
                response.status +
                "\n\n" +
                text;


        } catch (error) {

            result.textContent =
                testName +
                "\n\nTest error: " +
                error.message;

        }

    }


    // ==========================================
    // TEST 1 — EMPTY DETAILS
    // ==========================================

    document
        .getElementById("emptyBtn")
        .addEventListener("click", function () {

            runTest(
                "",
                "TEST 1 — Empty Details"
            );

        });


    // ==========================================
    // TEST 2 — EXACTLY 2000 CHARACTERS
    // ==========================================

    document
        .getElementById("validBtn")
        .addEventListener("click", function () {

            runTest(
                "A".repeat(2000),
                "TEST 2 — Exactly 2000 Characters"
            );

        });


    // ==========================================
    // TEST 3 — 2001 CHARACTERS
    // ==========================================

    document
        .getElementById("tooLongBtn")
        .addEventListener("click", function () {

            runTest(
                "A".repeat(2001),
                "TEST 3 — 2001 Characters"
            );

        });

</script>

</body></html>
