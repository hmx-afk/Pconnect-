<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PConnect Input Validation Test Suite</title>

</head>

<body>

    <h2>PConnect Input Validation Test Suite</h2>


    <!-- ==========================================
         TEST 1
         ========================================== -->

    <button id="emptyBtn">
        Test Empty Details
    </button>

    <br><br>


    <!-- ==========================================
         TEST 2
         ========================================== -->

    <button id="validBtn">
        Test 2000 Characters
    </button>

    <br><br>


    <!-- ==========================================
         TEST 3
         ========================================== -->

    <button id="tooLongBtn">
        Test 2001 Characters
    </button>

    <br><br>


    <!-- ==========================================
         TEST 4
         ========================================== -->

    <button id="nameBtn">
        Test Name 101 Characters
    </button>

    <br><br>


    <!-- ==========================================
         TEST 5
         ========================================== -->

    <button id="contactBtn">
        Test Contact 151 Characters
    </button>

    <br><br>


    <!-- ==========================================
         TEST 6
         ========================================== -->

    <button id="tokenBtn">
        Test Missing Pi AccessToken
    </button>

    <br><br>


    <pre id="result"></pre>


    <script>

        const API_URL =
            "https://pconnect-rho.vercel.app/api/test-validation";

        const result =
            document.getElementById("result");


        // ==========================================
        // GENERAL TEST FUNCTION
        // ==========================================

        async function runTest(testName, body) {

            result.textContent =
                testName +
                "\n\nTesting...";

            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(body)
                        }
                    );


                const text =
                    await response.text();


                result.textContent =
                    testName +
                    "\n\n" +
                    "HTTP Status: " +
                    response.status +
                    "\n\n" +
                    text;


            } catch (error) {

                result.textContent =
                    testName +
                    "\n\n" +
                    "Test error: " +
                    error.message;

            }

        }


        // ==========================================
        // TEST 1 — EMPTY DETAILS
        // ==========================================

        document
            .getElementById("emptyBtn")
            .addEventListener(
                "click",
                function () {

                    runTest(
                        "TEST 1 — Empty Details",
                        {
                            test: "details",
                            details: ""
                        }
                    );

                }
            );


        // ==========================================
        // TEST 2 — EXACTLY 2000 CHARACTERS
        // ==========================================

        document
            .getElementById("validBtn")
            .addEventListener(
                "click",
                function () {

                    runTest(
                        "TEST 2 — Exactly 2000 Characters",
                        {
                            test: "details",
                            details: "A".repeat(2000)
                        }
                    );

                }
            );


        // ==========================================
        // TEST 3 — 2001 CHARACTERS
        // ==========================================

        document
            .getElementById("tooLongBtn")
            .addEventListener(
                "click",
                function () {

                    runTest(
                        "TEST 3 — 2001 Characters",
                        {
                            test: "details",
                            details: "A".repeat(2001)
                        }
                    );

                }
            );


        // ==========================================
        // TEST 4 — NAME 101 CHARACTERS
        // ==========================================

        document
            .getElementById("nameBtn")
            .addEventListener(
                "click",
                function () {

                    runTest(
                        "TEST 4 — Name 101 Characters",
                        {
                            test: "name",
                            name: "A".repeat(101)
                        }
                    );

                }
            );


        // ==========================================
        // TEST 5 — CONTACT 151 CHARACTERS
        // ==========================================

        document
            .getElementById("contactBtn")
            .addEventListener(
                "click",
                function () {

                    runTest(
                        "TEST 5 — Contact 151 Characters",
                        {
                            test: "contact",
                            contact: "A".repeat(151)
                        }
                    );

                }
            );


        // ==========================================
        // TEST 6 — MISSING PI ACCESS TOKEN
        // ==========================================

        document
            .getElementById("tokenBtn")
            .addEventListener(
                "click",
                function () {

                    runTest(
                        "TEST 6 — Missing Pi accessToken",
                        {
                            test: "accessToken"
                        }
                    );

                }
            );

    </script>

</body>

</html>
