<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PConnect Validation Test</title>

</head>

<body>

    <h2>PConnect Input Validation Test</h2>

    <button id="contactBtn">
        Test Contact 151 Characters
    </button>

    <br><br>

    <pre id="result"></pre>


    <script>

        const result =
            document.getElementById("result");


        document
            .getElementById("contactBtn")
            .addEventListener("click", async function () {

                result.textContent =
                    "TEST 5 — Contact 151 Characters\n\nTesting...";

                try {

                    const response =
                        await fetch(
                            "https://pconnect-rho.vercel.app/api/test-validation",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        test: "contact",
                                        contact: "A".repeat(151)
                                    })
                            }
                        );


                    const text =
                        await response.text();


                    result.textContent =
                        "TEST 5 — Contact 151 Characters\n\n" +
                        "HTTP Status: " +
                        response.status +
                        "\n\n" +
                        text;


                } catch (error) {

                    result.textContent =
                        "Test error: " +
                        error.message;

                }

            });

    </script>

</body>

</html>
