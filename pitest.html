<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Test</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family:Arial;padding:20px">

<h2>Pi Sign-in Test</h2>

<button id="b" style="padding:14px;width:100%;font-size:16px">
    Test Sign in
</button>

<pre id="o" style="white-space:pre-wrap;margin-top:15px">Ready.</pre>

<script>
const o = document.getElementById("o");

if (typeof Pi === "undefined") {

    o.textContent = "Pi SDK not loaded";

} else {

    Pi.init({ version: "2.0", sandbox: true });

    document.getElementById("b").onclick = async function () {

        o.textContent = "Connecting...";

        try {

            const a = await Pi.authenticate(
                ["username", "payments"],
                function () {}
            );

            o.textContent =
                "OK: " + a.user.username +
                "\nToken: " + (a.accessToken ? "yes" : "no");

        } catch (e) {

            o.textContent =
                "ERROR: " + (e && e.message ? e.message : String(e));

        }

    };

}
</script>

</body>
</html>
