<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PConnect Notifications Test</title>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            font-size: 24px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #2196f3;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 8px 5px 8px 0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin: 15px 0;
            padding: 12px;
            background: white;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .notification {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #2196f3;
            overflow-wrap: anywhere;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #20752c;
        }
    </style>
</head>

<body>

    <h1>🔔 PConnect Notifications Test</h1>

    <p id="account">Pi account: Not connected</p>

    <button id="loginButton" type="button">
        Connect Pi Account
    </button>

    <button id="refreshButton" type="button" disabled>
        Refresh Notifications
    </button>

    <div id="status" role="status" aria-live="polite">
        Open this page in Pi Browser and connect your Pi account.
    </div>

    <div id="notifications"></div>

    <script>
        "use strict";

        let currentPiAccessToken = null;
        let currentPiUsername = null;
        let piSdkReady = false;

        const statusElement =
            document.getElementById("status");

        const accountElement =
            document.getElementById("account");

        const loginButton =
            document.getElementById("loginButton");

        const refreshButton =
            document.getElementById("refreshButton");

        const notificationsContainer =
            document.getElementById("notifications");

        function setStatus(message, isError = false) {
            statusElement.textContent = message;

            statusElement.className =
                isError ? "error" : "success";
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(
                /[&<>"']/g,
                character => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                })[character]
            );
        }

        function initializePiSdk() {
            if (
                typeof window.Pi === "undefined"
            ) {
                setStatus(
                    "Pi SDK is unavailable. Open this page inside Pi Browser.",
                    true
                );

                loginButton.disabled = true;
                return false;
            }

            try {
                window.Pi.init({
                    version: "2.0",
                    sandbox: true
                });

                piSdkReady = true;
                return true;

            } catch (error) {
                console.error(
                    "Pi SDK initialization failed:",
                    error
                );

                setStatus(
                    "Unable to initialize Pi SDK.",
                    true
                );

                loginButton.disabled = true;
                return false;
            }
        }

        async function connectPiAccount() {
            if (!piSdkReady) {
                setStatus(
                    "Pi SDK is not ready. Open this page in Pi Browser.",
                    true
                );
                return;
            }

            loginButton.disabled = true;
            setStatus("Connecting to Pi account...");
            notificationsContainer.replaceChildren();

            try {
                const auth = await window.Pi.authenticate(
                    ["username"],
                    function onIncompletePaymentFound(payment) {
                        console.warn(
                            "Incomplete payment:",
                            payment
                        );
                    }
                );

                if (
                    !auth ||
                    !auth.accessToken ||
                    !auth.user ||
                    !auth.user.username
                ) {
                    throw new Error(
                        "Pi authentication did not return the required account information."
                    );
                }

                currentPiAccessToken =
                    auth.accessToken;

                currentPiUsername =
                    auth.user.username;

                accountElement.textContent =
                    "Pi account: " + currentPiUsername;

                refreshButton.disabled = false;

                setStatus(
                    "Pi account connected. Loading notifications..."
                );

                await loadNotifications();

            } catch (error) {
                console.error(
                    "Pi authentication failed:",
                    error
                );

                currentPiAccessToken = null;
                currentPiUsername = null;

                accountElement.textContent =
                    "Pi account: Not connected";

                refreshButton.disabled = true;

                setStatus(
                    error?.message ||
                    "Pi authentication failed.",
                    true
                );

            } finally {
                loginButton.disabled = false;
            }
        }

        async function loadNotifications() {
            if (
                !currentPiAccessToken ||
                !currentPiUsername
            ) {
                setStatus(
                    "Connect your Pi account first.",
                    true
                );
                return;
            }

            refreshButton.disabled = true;

            setStatus("Loading notifications...");

            notificationsContainer.replaceChildren();

            try {
                const response = await fetch(
                    "/api/notifications",
                    {
                        method: "GET",
                        headers: {
                            "Authorization":
                                "Bearer " +
                                currentPiAccessToken,

                            "Accept":
                                "application/json"
                        },
                        cache: "no-store"
                    }
                );

                const data = await response.json();

                console.log(
                    "Notifications API status:",
                    response.status
                );

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        "Failed to load notifications."
                    );
                }

                const notifications =
                    Array.isArray(data.notifications)
                        ? data.notifications
                        : [];

                setStatus(
                    "Success — " +
                    notifications.length +
                    " notification(s) found."
                );

                if (notifications.length === 0) {
                    notificationsContainer.textContent =
                        "No notifications found.";
                    return;
                }

                for (const notification of notifications) {
                    const card =
                        document.createElement("div");

                    card.className = "notification";

                    card.innerHTML = `
                        <h3>${escapeHtml(notification.title)}</h3>

                        <p>${escapeHtml(notification.message)}</p>

                        <small>
                            Type: ${escapeHtml(notification.type)}
                            <br>
                            Request #${escapeHtml(notification.request_id)}
                            <br>
                            Read: ${notification.is_read ? "Yes" : "No"}
                        </small>

                        ${
                            notification.is_read
                                ? ""
                                : `<br><button type="button" class="readButton">Mark as read</button>`
                        }
                    `;

                    const readButton =
                        card.querySelector(".readButton");

                    if (readButton) {
                        readButton.addEventListener(
                            "click",
                            () => markAsRead(
                                notification.id,
                                readButton
                            )
                        );
                    }

                    notificationsContainer.appendChild(card);
                }

            } catch (error) {
                console.error(
                    "Loading notifications failed:",
                    error
                );

                setStatus(
                    "Error: " +
                    (error?.message ||
                    "Unable to load notifications."),
                    true
                );

            } finally {
                refreshButton.disabled = false;
            }
        }

        async function markAsRead(
            notificationId,
            button
        ) {
            if (!currentPiAccessToken) {
                setStatus(
                    "Your Pi session is missing. Connect again.",
                    true
                );
                return;
            }

            button.disabled = true;

            try {
                const response = await fetch(
                    "/api/notifications",
                    {
                        method: "PATCH",
                        headers: {
                            "Authorization":
                                "Bearer " +
                                currentPiAccessToken,

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },
                        cache: "no-store",
                        body: JSON.stringify({
                            id: notificationId
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        "Unable to mark notification as read."
                    );
                }

                setStatus(
                    "Notification marked as read."
                );

                await loadNotifications();

            } catch (error) {
                console.error(
                    "Mark-as-read failed:",
                    error
                );

                setStatus(
                    error?.message ||
                    "Unable to mark notification as read.",
                    true
                );

                button.disabled = false;
            }
        }

        loginButton.addEventListener(
            "click",
            connectPiAccount
        );

        refreshButton.addEventListener(
            "click",
            loadNotifications
        );

        initializePiSdk();
    </script>

</body>
</html>
