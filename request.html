<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Request Service | PiConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            padding-bottom: 80px;
        }

        header {
            background: #6c4cff;
            color: white;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            border: none;
            background: #6c4cff;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            background: #e9f8ef;
            color: #16803c;
            font-weight: bold;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 14px 5px;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.08);
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <a href="service.html">← Back to Service</a>
    </header>

    <div class="container">

        <div class="card">

            <h1>📩 Request Service</h1>

            <p class="description">
                Send a request for Web Development service.
                Payment will be added later.
            </p>

            <form onsubmit="submitRequest(event)">

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="contact">
                    Contact
                </label>

                <input
                    type="text"
                    id="contact"
                    placeholder="Email or username"
                    required
                >

                <label for="details">
                    Project Details
                </label>

                <textarea
                    id="details"
                    placeholder="Describe what you need..."
                    required
                ></textarea>

                <button type="submit">
                    Send Request
                </button>

            </form>

            <div
                id="message"
                class="message"
            >
                ✅ Request submitted successfully.
            </div>

        </div>

    </div>

    <nav>

        <a href="index.html">
            🏠<br>Home
        </a>

        <a href="browse.html">
            🔎<br>Browse
        </a>

        <a href="#">
            📝<br>Post
        </a>

        <a href="#">
            💳<br>Payments
        </a>

        <a href="#">
            👤<br>Profile
        </a>

    </nav>

    <script>

        function submitRequest(event) {

            event.preventDefault();

            document.getElementById("message").style.display = "block";

        }

    </script>

</body>

</html>
