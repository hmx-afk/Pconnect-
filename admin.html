<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Review | PConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #10051f;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            color: #ffbf00;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b9a9c9;
            margin-bottom: 20px;
        }

        .login-box,
        .request-card {
            background: #1d0b35;
            border: 1px solid #3b1b5c;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #56307a;
            background: #120721;
            color: white;
            margin: 10px 0;
            outline: none;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 5px 0 0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-btn {
            background: #ffbf00;
            color: #180b25;
            width: 100%;
        }

        .approve {
            background: #28c76f;
            color: white;
        }

        .reject {
            background: #e74c3c;
            color: white;
        }

        .logout {
            background: #5b3a70;
            color: white;
            margin-bottom: 18px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin: 8px 0;
            background: #6b4d00;
        }

        .approved {
            background: #176b3a;
        }

        .rejected {
            background: #70231d;
        }

        .info {
            color: #d8cde1;
            line-height: 1.6;
            margin-top: 8px;
        }

        .message {
            margin: 12px 0;
            padding: 10px;
            border-radius: 8px;
            background: #24103d;
            color: #d8cde1;
        }

        .hidden {
            display: none;
        }

        .empty {
            text-align: center;
            color: #b9a9c9;
            padding: 30px;
        }

        .error {
            color: #ff8f8f;
            margin-top: 10px;
        }

        .success {
            color: #75e6a7;
            margin-top: 10px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .count {
            color: #ffbf00;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <div>
            <h1>🔐 PConnect Admin</h1>
            <div class="subtitle">Request Review System</div>
        </div>

        <button class="logout hidden" id="logoutBtn">
            Logout
        </button>
    </div>

    <!-- LOGIN -->
    <div class="login-box" id="loginBox">

        <h3>Admin Access</h3>

        <p class="info">
            Enter your admin review key to continue.
        </p>

        <input
            type="password"
            id="adminKey"
            placeholder="Enter admin key"
            autocomplete="off"
        >

        <button class="login-btn" id="loginBtn">
            Login
        </button>

        <div id="loginMessage"></div>

    </div>

    <!-- ADMIN CONTENT -->
    <div id="adminContent" class="hidden">

        <div class="message">
            <strong>Review Requests</strong>
            <br>
            Total:
            <span class="count" id="totalCount">0</span>
        </div>

        <div id="requestsContainer"></div>

    </div>

</div>

<script>

let adminKey =
    sessionStorage.getItem("pconnect_admin_key") || "";

const loginBox =
    document.getElementById("loginBox");

const adminContent =
    document.getElementById("adminContent");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const adminKeyInput =
    document.getElementById("adminKey");

const loginMessage =
    document.getElementById("loginMessage");

const requestsContainer =
    document.getElementById("requestsContainer");

const totalCount =
    document.getElementById("totalCount");


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================================
   SHOW ADMIN
========================================== */

function showAdmin() {

    loginBox.classList.add("hidden");

    adminContent.classList.remove("hidden");

    logoutBtn.classList.remove("hidden");

    loadRequests();
}


/* ==========================================
   SHOW LOGIN
========================================== */

function showLogin() {

    loginBox.classList.remove("hidden");

    adminContent.classList.add("hidden");

    logoutBtn.classList.add("hidden");
}


/* ==========================================
   LOGIN
========================================== */

async function login() {

    const key =
        adminKeyInput.value.trim();

    if (!key) {

        loginMessage.innerHTML =
            '<div class="error">Please enter your admin key.</div>';

        return;
    }

    loginBtn.disabled = true;

    loginMessage.innerHTML =
        '<div class="message">Checking admin key...</div>';

    try {

        const response =
            await fetch("/api/admin-requests", {

                method: "GET",

                headers: {
                    "x-admin-key": key
                }
            });

        const data =
            await response.json();

        if (!response.ok) {

            loginMessage.innerHTML =
                `<div class="error">
                    ${escapeHtml(
                        data.error ||
                        "Invalid admin key."
                    )}
                </div>`;

            return;
        }

        /*
         * Server accepted the key.
         * Save it only for this browser session.
         */

        adminKey = key;

        sessionStorage.setItem(
            "pconnect_admin_key",
            adminKey
        );

        loginMessage.innerHTML =
            '<div class="success">Admin access granted.</div>';

        showAdmin();

    } catch (error) {

        console.error(error);

        loginMessage.innerHTML =
            '<div class="error">Connection error.</div>';

    } finally {

        loginBtn.disabled = false;
    }
}


/* ==========================================
   LOAD REQUESTS
========================================== */

async function loadRequests() {

    requestsContainer.innerHTML =
        '<div class="empty">Loading requests...</div>';

    try {

        const response =
            await fetch("/api/admin-requests", {

                method: "GET",

                headers: {
                    "x-admin-key": adminKey
                }
            });

        const data =
            await response.json();

        /*
         * If saved session key is no longer valid,
         * return to login.
         */

        if (response.status === 401) {

            sessionStorage.removeItem(
                "pconnect_admin_key"
            );

            adminKey = "";

            showLogin();

            loginMessage.innerHTML =
                '<div class="error">Admin session expired. Please login again.</div>';

            return;
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load requests"
            );
        }

        const requests =
            data.requests || [];

        totalCount.textContent =
            requests.length;

        if (requests.length === 0) {

            requestsContainer.innerHTML =
                '<div class="empty">No requests found.</div>';

            return;
        }

        requestsContainer.innerHTML =
            requests.map(request => {

                const status =
                    request.review_status ||
                    "Waiting for review";

                let statusClass = "";

                if (status === "Approved") {
                    statusClass = "approved";
                }

                if (status === "Rejected") {
                    statusClass = "rejected";
                }

                return `
                    <div class="request-card">

                        <h3>
                            ${escapeHtml(request.name)}
                        </h3>

                        <div class="info">

                            <strong>Service:</strong>
                            ${escapeHtml(request.service)}

                            <br>

                            <strong>Contact:</strong>
                            ${escapeHtml(request.contact)}

                            <br>

                            <strong>Details:</strong>
                            ${escapeHtml(request.details)}

                        </div>

                        <div class="status ${statusClass}">
                            ${escapeHtml(status)}
                        </div>

                        <div>

                            <button
                                class="approve"
                                onclick="reviewRequest('${request.id}', 'approve')"
                                ${status === "Approved" ? "disabled" : ""}
                            >
                                ✅ Approve
                            </button>

                            <button
                                class="reject"
                                onclick="reviewRequest('${request.id}', 'reject')"
                                ${status === "Rejected" ? "disabled" : ""}
                            >
                                ❌ Reject
                            </button>

                        </div>

                    </div>
                `;

            }).join("");

    } catch (error) {

        console.error(error);

        requestsContainer.innerHTML =
            `<div class="empty">
                Failed to load requests.
                <br>
                ${escapeHtml(error.message)}
            </div>`;
    }
}


/* ==========================================
   APPROVE / REJECT REQUEST
========================================== */

async function reviewRequest(id, action) {

    const confirmText =
        action === "approve"
            ? "Approve this request?"
            : "Reject this request?";

    if (!confirm(confirmText)) {
        return;
    }

    try {

        const response =
            await fetch("/api/admin-review", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "x-admin-key": adminKey
                },

                body: JSON.stringify({
                    id: id,
                    action: action
                })
            });

        const data =
            await response.json();

        if (response.status === 401) {

            sessionStorage.removeItem(
                "pconnect_admin_key"
            );

            adminKey = "";

            showLogin();

            loginMessage.innerHTML =
                '<div class="error">Admin session expired. Please login again.</div>';

            return;
        }

        if (!response.ok) {

            alert(
                data.error ||
                "Failed to update request."
            );

            return;
        }

        alert(
            action === "approve"
                ? "Request approved successfully."
                : "Request rejected successfully."
        );

        await loadRequests();

    } catch (error) {

        console.error(error);

        alert(
            "Connection error. Please try again."
        );
    }
}


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    sessionStorage.removeItem(
        "pconnect_admin_key"
    );

    adminKey = "";

    adminKeyInput.value = "";

    loginMessage.innerHTML = "";

    showLogin();
}


/* ==========================================
   EVENTS
========================================== */

loginBtn.addEventListener(
    "click",
    login
);

logoutBtn.addEventListener(
    "click",
    logout
);

adminKeyInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            login();
        }

    }
);


/* ==========================================
   RESTORE SESSION SECURELY
========================================== */

async function restoreAdminSession() {

    if (!adminKey) {

        showLogin();

        return;
    }

    loginMessage.innerHTML =
        '<div class="message">Checking admin session...</div>';

    try {

        const response =
            await fetch("/api/admin-requests", {

                method: "GET",

                headers: {
                    "x-admin-key": adminKey
                }
            });

        if (response.ok) {

            showAdmin();

            return;
        }

    } catch (error) {

        console.error(error);
    }

    /*
     * Stored key is invalid or session check failed.
     */

    sessionStorage.removeItem(
        "pconnect_admin_key"
    );

    adminKey = "";

    showLogin();

    loginMessage.innerHTML =
        '<div class="error">Please login again.</div>';
}


/* ==========================================
   START
========================================== */

restoreAdminSession();

</script>

</body>
</html>
