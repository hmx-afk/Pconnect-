<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Review | PConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #10051f;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            color: #ffbf00;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b9a9c9;
            margin-bottom: 20px;
        }

        .login-box,
        .request-card {
            background: #1d0b35;
            border: 1px solid #3b1b5c;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #56307a;
            background: #120721;
            color: white;
            margin: 10px 0;
            outline: none;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 5px 0 0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-btn {
            background: #ffbf00;
            color: #180b25;
            width: 100%;
        }

        .approve {
            background: #28c76f;
            color: white;
        }

        .reject {
            background: #e74c3c;
            color: white;
        }

        .progress {
            background: #2980b9;
            color: white;
        }

        .complete {
            background: #16a085;
            color: white;
        }

        .cancel {
            background: #8e44ad;
            color: white;
        }

        .logout {
            background: #5b3a70;
            color: white;
            margin-bottom: 18px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin: 8px 5px 8px 0;
            background: #6b4d00;
        }

        .approved {
            background: #176b3a;
        }

        .rejected {
            background: #70231d;
        }

        .pending {
            background: #6b4d00;
        }

        .paid {
            background: #176b3a;
        }

        .in-progress {
            background: #245a8a;
        }

        .completed {
            background: #087f5b;
        }

        .cancelled {
            background: #70231d;
        }

        .info {
            color: #d8cde1;
            line-height: 1.6;
            margin-top: 8px;
            overflow-wrap: anywhere;
        }

        .message {
            margin: 12px 0;
            padding: 10px;
            border-radius: 8px;
            background: #24103d;
            color: #d8cde1;
        }

        .hidden {
            display: none;
        }

        .empty {
            text-align: center;
            color: #b9a9c9;
            padding: 30px;
        }

        .error {
            color: #ff8f8f;
            margin-top: 10px;
        }

        .success {
            color: #75e6a7;
            margin-top: 10px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .count {
            color: #ffbf00;
            font-weight: bold;
        }

        .section-title {
            color: #ffbf00;
            margin-top: 14px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .action-box {
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <div>
            <h1>🔐 PConnect Admin</h1>
            <div class="subtitle">
                Request Review & Order Management
            </div>
        </div>

        <button
            class="logout hidden"
            id="logoutBtn"
            type="button"
        >
            Logout
        </button>
    </div>

    <div class="login-box" id="loginBox">

        <h3>Admin Access</h3>

        <p class="info">
            Enter your admin review key to continue.
        </p>

        <input
            type="password"
            id="adminKey"
            placeholder="Enter admin key"
            autocomplete="current-password"
            maxlength="4096"
        >

        <button
            class="login-btn"
            id="loginBtn"
            type="button"
        >
            Login
        </button>

        <div id="loginMessage" aria-live="polite"></div>

    </div>

    <div id="adminContent" class="hidden">

        <div class="message">

            <strong>Review Requests</strong>

            <br>

            Total:
            <span class="count" id="totalCount">0</span>

            <button
                type="button"
                id="refreshBtn"
            >
                Refresh
            </button>

        </div>

        <div id="requestsContainer"></div>

    </div>

</div>

<script src="admin.js" defer></script>

</body>
</html>
