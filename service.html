<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development | PiConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            padding-bottom: 80px;
        }

        header {
            background: #6c4cff;
            color: white;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .info {
            background: #f1efff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .info p {
            margin: 8px 0;
        }

        .available {
            color: #16803c;
            font-weight: bold;
        }

        .request-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: #6c4cff;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .request-btn:hover {
            opacity: 0.9;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 14px 5px;
            box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.08);
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <a href="browse.html">← Back to Services</a>
    </header>

    <div class="container">

        <div class="card">

            <div class="icon">💻</div>

            <h1>Web Development</h1>

            <p class="description">
                Build modern websites and simple web applications
                for individuals, businesses and projects.
            </p>

            <div class="info">

                <p>
                    <strong>Status:</strong>
                    <span class="available">Available</span>
                </p>

                <p>
                    <strong>Service Type:</strong>
                    Web Development
                </p>

                <p>
                    <strong>Payment:</strong>
                    Pi Network
                </p>

            </div>

            <a href="request.html" class="request-btn">
                Request Service
            </a>

        </div>

    </div>

    <nav>
        <a href="index.html">🏠<br>Home</a>
        <a href="browse.html">🔎<br>Browse</a>
        <a href="#">📝<br>Post</a>
        <a href="#">💳<br>Payments</a>
        <a href="#">👤<br>Profile</a>
    </nav>

</body>
</html>
