<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PConnect Security Headers Test</title>
</head>

<body>

    <h2>PConnect Security Headers Test</h2>

    <button id="testBtn">
        Test Security Headers
    </button>

    <pre id="result"></pre>

    <script>

        const result = document.getElementById("result");
        const testBtn = document.getElementById("testBtn");

        testBtn.addEventListener("click", async function () {

            result.textContent = "Testing...";

            try {

                const response = await fetch(
                    "https://pconnect-rho.vercel.app/api/requests?pi_username=hamzaomar62",
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );

                const headers = {
                    "Cache-Control":
                        response.headers.get("cache-control"),

                    "X-Content-Type-Options":
                        response.headers.get("x-content-type-options"),

                    "X-Frame-Options":
                        response.headers.get("x-frame-options"),

                    "Referrer-Policy":
                        response.headers.get("referrer-policy"),

                    "Content-Security-Policy":
                        response.headers.get("content-security-policy")
                };

                result.textContent =
                    "HTTP Status: " +
                    response.status +
                    "\n\n" +

                    "Cache-Control: " +
                    (headers["Cache-Control"] || "NOT FOUND") +
                    "\n\n" +

                    "X-Content-Type-Options: " +
                    (headers["X-Content-Type-Options"] || "NOT FOUND") +
                    "\n\n" +

                    "X-Frame-Options: " +
                    (headers["X-Frame-Options"] || "NOT FOUND") +
                    "\n\n" +

                    "Referrer-Policy: " +
                    (headers["Referrer-Policy"] || "NOT FOUND") +
                    "\n\n" +

                    "Content-Security-Policy: " +
                    (headers["Content-Security-Policy"] || "NOT FOUND");

            } catch (error) {

                result.textContent =
                    "TEST ERROR ❌\n\n" +
                    error.message;

            }

        });

    </script>

</body>
</html>
