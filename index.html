<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PConnect</title>

    <link rel="stylesheet" href="style.css">

    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>


<body>

    <main class="app-shell">


        <!-- =====================================
             TOP BAR
        ====================================== -->

        <div class="topbar">

            <h1>
                🔗 PConnect
            </h1>

        </div>



        <!-- =====================================
             WELCOME / PI CONNECTION
        ====================================== -->

        <section class="card">

            <h2 id="welcomeTitle">
                Welcome to PConnect
            </h2>

            <p id="welcomeText">
                Connect with trusted services
                in the Pi ecosystem.
            </p>


            <!-- Pi Login -->

            <button
                id="loginBtn"
                class="btn btn-amber"
            >
                Sign in with Pi
            </button>


            <!-- Payment -->

            <button
                id="payBtn"
                class="btn btn-blue"
                disabled
            >
                Make Test Payment (0.01 π)
            </button>


            <!-- Login Status -->

            <p id="status">
                Not connected
            </p>


            <!-- Payment Status -->

            <p id="payStatus"></p>

        </section>



        <!-- =====================================
             QUICK ACTIONS
        ====================================== -->

        <section class="card">

            <h2>
                Quick Actions
            </h2>


            <div class="grid-2">


                <!-- Browse -->

                <a
                    href="#"
                    class="quick-action"
                >

                    <i>🔎</i>

                    <p>
                        Browse
                    </p>

                </a>



                <!-- My Requests -->

                <a
                    href="#"
                    class="quick-action"
                >

                    <i>📝</i>

                    <p>
                        My Requests
                    </p>

                </a>



                <!-- Transactions -->

                <a
                    href="#"
                    class="quick-action"
                >

                    <i>💳</i>

                    <p>
                        Transactions
                    </p>

                </a>



                <!-- Profile -->

                <a
                    href="#"
                    class="quick-action"
                >

                    <i>👤</i>

                    <p>
                        Profile
                    </p>

                </a>


            </div>

        </section>



        <!-- =====================================
             RECENT ACTIVITY
        ====================================== -->

        <section class="card">


            <div class="topbar">

                <h1>
                    Recent Activity
                </h1>

            </div>


            <div class="item">

                <strong>
                    Welcome to PConnect
                </strong>


                <p>
                    Your Pi ecosystem journey
                    starts here.
                </p>


                <span class="badge badge-success">
                    Ready
                </span>

            </div>


        </section>



        <!-- =====================================
             BOTTOM NAVIGATION
        ====================================== -->

        <nav class="bottom-nav">


            <!-- Home -->

            <a
                href="#"
                class="active"
                aria-label="Home"
            >
                🏠
            </a>


            <!-- Browse -->

            <a
                href="#"
                aria-label="Browse"
            >
                🔎
            </a>


            <!-- Requests -->

            <a
                href="#"
                aria-label="Requests"
            >
                📝
            </a>


            <!-- Transactions -->

            <a
                href="#"
                aria-label="Transactions"
            >
                💳
            </a>


            <!-- Profile -->

            <a
                href="#"
                aria-label="Profile"
            >
                👤
            </a>


        </nav>


    </main>



    <!-- =====================================
         PConnect JavaScript
    ====================================== -->

    <script src="app.js"></script>

</body>

</html>
