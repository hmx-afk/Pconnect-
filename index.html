<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Requests - PConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0b1a;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
        }

        header {
            padding: 20px 0;
        }

        .back-link {
            color: #c7a7ff;
            font-size: 14px;
        }

        h1 {
            margin-top: 18px;
            font-size: 28px;
        }

        .subtitle {
            color: #aaa;
            margin-top: 8px;
            line-height: 1.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .stat-card {
            background: #1a1427;
            border: 1px solid #302447;
            border-radius: 14px;
            padding: 18px 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        .stat-label {
            color: #aaa;
            font-size: 12px;
            margin-top: 6px;
        }

        .refresh-btn {
            width: 100%;
            border: 1px solid #49346d;
            background: #191224;
            color: #ffffff;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .refresh-btn:hover {
            background: #241936;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .request-card {
            background: #181222;
            border: 1px solid #302447;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .request-title {
            font-size: 17px;
            font-weight: bold;
        }

        .service {
            color: #c7a7ff;
            font-size: 14px;
            margin-top: 5px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .approved {
            background: #173d29;
            color: #6ff0a4;
        }

        .waiting {
            background: #3d3217;
            color: #ffd76a;
        }

        .paid-status {
            margin-top: 12px;
            background: #173d29;
            color: #6ff0a4;
            border: 1px solid #286443;
            border-radius: 10px;
            padding: 11px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .info {
            border-top: 1px solid #2b2239;
            padding-top: 13px;
        }

        .info-row {
            margin-bottom: 12px;
        }

        .label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .value {
            color: #eee;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .submitted {
            color: #888;
            font-size: 12px;
            margin-top: 15px;
        }

        .pay-btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #f5b642;
            color: #17110a;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .pay-btn:hover {
            background: #ffc95f;
        }

        .empty {
            text-align: center;
            padding: 40px 15px;
            color: #999;
            background: #181222;
            border: 1px solid #302447;
            border-radius: 16px;
        }

        .error {
            text-align: center;
            padding: 25px;
            color: #ff8c8c;
            background: #29171c;
            border: 1px solid #55252d;
            border-radius: 14px;
        }

        nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #120d1d;
            border-top: 1px solid #302447;
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            z-index: 1000;
        }

        nav a {
            color: #aaa;
            font-size: 11px;
            text-align: center;
        }

        nav a.active {
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .stats {
                gap: 8px;
            }

            .stat-card {
                padding: 15px 5px;
            }

            .stat-number {
                font-size: 23px;
            }

            .request-header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <a href="/browse.html" class="back-link">← Back to Browse</a>

        <h1>📋 My Requests</h1>

        <p class="subtitle">
            Track your service requests and review their current status.
        </p>
    </header>

    <section class="stats">

        <div class="stat-card">
            <div class="stat-number" id="totalRequests">0</div>
            <div class="stat-label">TOTAL REQUESTS</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="waitingRequests">0</div>
            <div class="stat-label">WAITING REVIEW</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="approvedRequests">0</div>
            <div class="stat-label">APPROVED</div>
        </div>

    </section>

    <button id="refreshBtn" class="refresh-btn">
        🔄 Refresh Requests
    </button>

    <h2 class="section-title">Recent Requests</h2>

    <div id="requestsList">
        <div class="empty">
            Loading requests...
        </div>
    </div>

</div>

<nav>
    <a href="/index.html">
        🏠<br>Home
    </a>

    <a href="/browse.html">
        🔎<br>Browse
    </a>

    <a href="/requests.html" class="active">
        📋<br>Requests
    </a>

    <a href="/payments.html">
        💳<br>Payments
    </a>

    <a href="/profile.html">
        👤<br>Profile
    </a>
</nav>

<script>
    const requestsList = document.getElementById("requestsList");
    const totalRequests = document.getElementById("totalRequests");
    const waitingRequests = document.getElementById("waitingRequests");
    const approvedRequests = document.getElementById("approvedRequests");
    const refreshBtn = document.getElementById("refreshBtn");

    // ==========================================
    // LOAD REQUESTS + TRANSACTIONS
    // ==========================================

    async function loadRequests() {

        requestsList.innerHTML = `
            <div class="empty">
                Loading requests...
            </div>
        `;

        try {

            const [requestsResponse, transactionsResponse] =
                await Promise.all([
                    fetch("/api/requests", {
                        method: "GET",
                        cache: "no-store"
                    }),
                    fetch("/api/transactions", {
                        method: "GET",
                        cache: "no-store"
                    })
                ]);

            const requestsResult = await requestsResponse.json();
            const transactionsResult = await transactionsResponse.json();

            if (
                !requestsResponse.ok ||
                !requestsResult.success
            ) {
                throw new Error(
                    requestsResult.error ||
                    "Failed to load requests"
                );
            }

            if (
                !transactionsResponse.ok ||
                !transactionsResult.success
            ) {
                throw new Error(
                    transactionsResult.error ||
                    "Failed to load transactions"
                );
            }

            const requests = Array.isArray(
                requestsResult.requests
            )
                ? requestsResult.requests
                : [];

            const transactions = Array.isArray(
                transactionsResult.transactions
            )
                ? transactionsResult.transactions
                : [];

            updateStats(requests);

            renderRequests(
                requests,
                transactions
            );

        } catch (error) {

            console.error(
                "Requests loading error:",
                error
            );

            requestsList.innerHTML = `
                <div class="error">
                    ❌ Failed to load requests.<br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;
        }
    }

    // ==========================================
    // UPDATE STATS
    // ==========================================

    function updateStats(requests) {

        const waiting = requests.filter(request =>
            String(
                request.review_status || ""
            ).toLowerCase() ===
            "waiting for review"
        );

        const approved = requests.filter(request =>
            String(
                request.review_status || ""
            ).toLowerCase() ===
            "approved"
        );

        totalRequests.textContent =
            requests.length;

        waitingRequests.textContent =
            waiting.length;

        approvedRequests.textContent =
            approved.length;
    }

    // ==========================================
    // CHECK IF REQUEST IS PAID
    // ==========================================

    function isRequestPaid(
        requestId,
        transactions
    ) {

        return transactions.some(transaction => {

            const transactionRequestId =
                Number(transaction.request_id);

            const status =
                String(
                    transaction.status || ""
                ).toLowerCase();

            return (
                transactionRequestId ===
                Number(requestId) &&
                status === "completed"
            );
        });
    }

    // ==========================================
    // RENDER REQUESTS
    // ==========================================

    function renderRequests(
        requests,
        transactions
    ) {

        if (!requests.length) {

            requestsList.innerHTML = `
                <div class="empty">
                    No service requests found.
                </div>
            `;

            return;
        }

        requestsList.innerHTML =
            requests.map(request => {

                const id = Number(request.id);

                const service =
                    request.service ||
                    "Web Development";

                const name =
                    request.name ||
                    "N/A";

                const contact =
                    request.contact ||
                    "N/A";

                const details =
                    request.details ||
                    "No project details";

                const reviewStatus =
                    request.review_status ||
                    "Waiting for review";

                const createdAt =
                    request.created_at
                        ? new Date(
                            request.created_at
                        ).toLocaleString()
                        : "Unknown";

                const isApproved =
                    String(
                        reviewStatus
                    ).toLowerCase() ===
                    "approved";

                const paid =
                    isRequestPaid(
                        id,
                        transactions
                    );

                const statusClass =
                    isApproved
                        ? "approved"
                        : "waiting";

                let paymentAction = "";

                if (paid) {

                    paymentAction = `
                        <div class="paid-status">
                            💳 Paid ✅
                        </div>
                    `;

                } else if (
                    isApproved &&
                    Number.isInteger(id) &&
                    id > 0
                ) {

                    paymentAction = `
                        <a
                            href="/payments.html?request_id=${encodeURIComponent(id)}"
                            class="pay-btn"
                        >
                            💳 Pay for Request #${id}
                        </a>
                    `;
                }

                return `
                    <article class="request-card">

                        <div class="request-header">

                            <div>

                                <div class="request-title">
                                    📋 Request #${escapeHtml(
                                        String(id)
                                    )}
                                </div>

                                <div class="service">
                                    ${escapeHtml(
                                        service
                                    )}
                                </div>

                            </div>

                            <div class="status ${statusClass}">
                                ${escapeHtml(
                                    reviewStatus
                                )}
                            </div>

                        </div>

                        <div class="info">

                            <div class="info-row">
                                <div class="label">
                                    Name
                                </div>

                                <div class="value">
                                    ${escapeHtml(
                                        name
                                    )}
                                </div>
                            </div>

                            <div class="info-row">
                                <div class="label">
                                    Contact
                                </div>

                                <div class="value">
                                    ${escapeHtml(
                                        contact
                                    )}
                                </div>
                            </div>

                            <div class="info-row">
                                <div class="label">
                                    Project Details
                                </div>

                                <div class="value">
                                    ${escapeHtml(
                                        details
                                    )}
                                </div>
                            </div>

                        </div>

                        <div class="submitted">
                            🕒 Submitted:
                            ${escapeHtml(
                                createdAt
                            )}
                        </div>

                        ${paymentAction}

                    </article>
                `;

            }).join("");
    }

    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

    // ==========================================
    // REFRESH
    // ==========================================

    refreshBtn.addEventListener(
        "click",
        loadRequests
    );

    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadRequests();
</script>

</body>
</html>
