<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Requests | PConnect</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #0f0b1f;
        color: #ffffff;
        min-height: 100vh;
        padding-bottom: 85px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        padding: 20px;
    }

    .back {
        display: inline-block;
        color: #aaa3ba;
        text-decoration: none;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .back:hover {
        color: #f5b942;
    }

    .header {
        margin-bottom: 20px;
    }

    .header h1 {
        color: #f5b942;
        font-size: 27px;
        margin-bottom: 8px;
    }

    .header p {
        color: #aaa3ba;
        line-height: 1.5;
        font-size: 14px;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }

    .stat-card {
        background: #1b1430;
        border: 1px solid #30234d;
        border-radius: 14px;
        padding: 15px 10px;
        text-align: center;
    }

    .stat-number {
        color: #f5b942;
        font-size: 23px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .stat-label {
        color: #aaa3ba;
        font-size: 11px;
        line-height: 1.3;
    }

    .section-title {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .loading,
    .empty,
    .error-box {
        background: #1b1430;
        border: 1px solid #30234d;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        color: #aaa3ba;
        line-height: 1.5;
    }

    .error-box {
        color: #ff7676;
    }

    .request-card {
        background: #1b1430;
        border: 1px solid #30234d;
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 14px;
    }

    .request-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
        margin-bottom: 14px;
    }

    .request-id {
        color: #f5b942;
        font-size: 16px;
        font-weight: bold;
    }

    .service {
        color: #ffffff;
        font-size: 15px;
        font-weight: bold;
        margin-top: 5px;
    }

    .status-badge {
        padding: 6px 9px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        white-space: nowrap;
        background: #30234d;
        color: #f5b942;
    }

    .info {
        margin-bottom: 10px;
    }

    .label {
        color: #aaa3ba;
        font-size: 11px;
        margin-bottom: 4px;
    }

    .value {
        color: #ffffff;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
    }

    .details {
        background: #171025;
        border-radius: 10px;
        padding: 12px;
        margin-top: 12px;
    }

    .date {
        color: #77718a;
        font-size: 11px;
        margin-top: 13px;
    }

    .refresh-btn {
        width: 100%;
        border: 1px solid #3a2d59;
        border-radius: 10px;
        padding: 12px;
        background: #171025;
        color: #f5b942;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 18px;
    }

    .refresh-btn:hover {
        background: #241b3c;
    }

    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #171025;
        border-top: 1px solid #30234d;
        display: flex;
        justify-content: space-around;
        padding: 10px 5px;
        z-index: 100;
    }

    .bottom-nav a {
        color: #aaa3ba;
        text-decoration: none;
        font-size: 11px;
        text-align: center;
    }

    .bottom-nav a.active {
        color: #f5b942;
    }

    @media (max-width: 480px) {
        .stats {
            gap: 7px;
        }

        .stat-card {
            padding: 13px 6px;
        }

        .stat-number {
            font-size: 20px;
        }

        .stat-label {
            font-size: 10px;
        }

        .request-top {
            flex-direction: column;
        }

        .status-badge {
            align-self: flex-start;
        }
    }
</style>

</head><body><div class="container"><a href="/browse.html" class="back">
    ← Back to Browse
</a>

<div class="header">
    <h1>📋 My Requests</h1>

    <p>
        Track your service requests and review their current status.
    </p>
</div>


<!-- STATS -->

<div class="stats">

    <div class="stat-card">
        <div class="stat-number" id="totalRequests">
            0
        </div>

        <div class="stat-label">
            TOTAL REQUESTS
        </div>
    </div>


    <div class="stat-card">
        <div class="stat-number" id="waitingRequests">
            0
        </div>

        <div class="stat-label">
            WAITING REVIEW
        </div>
    </div>


    <div class="stat-card">
        <div class="stat-number" id="approvedRequests">
            0
        </div>

        <div class="stat-label">
            APPROVED
        </div>
    </div>

</div>


<button
    class="refresh-btn"
    id="refreshBtn"
    onclick="loadRequests()"
>
    🔄 Refresh Requests
</button>


<h2 class="section-title">
    Recent Requests
</h2>


<div id="requestList">

    <div class="loading">
        Loading your requests...
    </div>

</div>

</div><!-- BOTTOM NAV --><div class="bottom-nav"><a href="/index.html">
    🏠<br>Home
</a>

<a href="/browse.html">
    🔎<br>Browse
</a>

<a href="/requests.html" class="active">
    📋<br>Requests
</a>

<a href="/payments.html">
    💳<br>Payments
</a>

<a href="/profile.html">
    👤<br>Profile
</a>

</div><script>

    // ==========================================
    // PConnect - My Requests
    // ==========================================

    const totalRequests =
        document.getElementById("totalRequests");

    const waitingRequests =
        document.getElementById("waitingRequests");

    const approvedRequests =
        document.getElementById("approvedRequests");

    const requestList =
        document.getElementById("requestList");

    const refreshBtn =
        document.getElementById("refreshBtn");


    // ==========================================
    // LOAD REQUESTS
    // ==========================================

    async function loadRequests() {

        refreshBtn.disabled = true;
        refreshBtn.textContent = "⏳ Loading...";

        requestList.innerHTML = `
            <div class="loading">
                Loading your requests...
            </div>
        `;

        try {

            const response =
                await fetch("/api/requests", {
                    method: "GET",
                    cache: "no-store"
                });


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "Failed to load requests."
                );

            }


            const requests =
                Array.isArray(data.requests)
                    ? data.requests
                    : [];


            // ==================================
            // STATISTICS
            // ==================================

            totalRequests.textContent =
                requests.length;


            const waiting =
                requests.filter(function(request) {

                    const status =
                        String(
                            request.review_status ||
                            request.status ||
                            ""
                        ).toLowerCase();

                    return (
                        status.includes("waiting") ||
                        status.includes("review") ||
                        status === "submitted"
                    );

                });


            const approved =
                requests.filter(function(request) {

                    const status =
                        String(
                            request.review_status ||
                            request.status ||
                            ""
                        ).toLowerCase();

                    return status.includes("approved");

                });


            waitingRequests.textContent =
                waiting.length;


            approvedRequests.textContent =
                approved.length;


            // ==================================
            // EMPTY STATE
            // ==================================

            if (requests.length === 0) {

                requestList.innerHTML = `
                    <div class="empty">
                        📭<br><br>
                        No service requests yet.
                        <br><br>
                        Go to Browse Services to submit
                        your first request.
                    </div>
                `;

                return;
            }


            // ==================================
            // DISPLAY REQUESTS
            // ==================================

            requestList.innerHTML =
                requests.map(function(request) {

                    const id =
                        request.id ??
                        "N/A";

                    const service =
                        request.service ??
                        "Service Request";

                    const name =
                        request.name ??
                        "N/A";

                    const contact =
                        request.contact ??
                        "N/A";

                    const details =
                        request.details ??
                        "No details provided.";

                    const status =
                        request.review_status ||
                        request.status ||
                        "Submitted";


                    let createdAt = "";

                    if (request.created_at) {

                        const date =
                            new Date(
                                request.created_at
                            );

                        if (!isNaN(date.getTime())) {

                            createdAt =
                                date.toLocaleString();

                        }

                    }


                    return `

                        <div class="request-card">

                            <div class="request-top">

                                <div>

                                    <div class="request-id">
                                        📋 Request #${escapeHtml(id)}
                                    </div>

                                    <div class="service">
                                        ${escapeHtml(service)}
                                    </div>

                                </div>


                                <div class="status-badge">
                                    ${escapeHtml(status)}
                                </div>

                            </div>


                            <div class="info">

                                <div class="label">
                                    NAME
                                </div>

                                <div class="value">
                                    ${escapeHtml(name)}
                                </div>

                            </div>


                            <div class="info">

                                <div class="label">
                                    CONTACT
                                </div>

                                <div class="value">
                                    ${escapeHtml(contact)}
                                </div>

                            </div>


                            <div class="details">

                                <div class="label">
                                    PROJECT DETAILS
                                </div>

                                <div class="value">
                                    ${escapeHtml(details)}
                                </div>

                            </div>


                            ${
                                createdAt
                                    ? `
                                        <div class="date">
                                            🕒 Submitted:
                                            ${escapeHtml(createdAt)}
                                        </div>
                                      `
                                    : ""
                            }

                        </div>

                    `;

                }).join("");


        } catch (error) {

            console.error(
                "Load requests error:",
                error
            );


            requestList.innerHTML = `

                <div class="error-box">

                    ⚠️ ${escapeHtml(
                        error.message ||
                        "Failed to load requests."
                    )}

                    <br><br>

                    Please try again.

                </div>

            `;

        } finally {

            refreshBtn.disabled = false;
            refreshBtn.textContent =
                "🔄 Refresh Requests";

        }

    }


    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // START
    // ==========================================

    loadRequests();

</script></body>
</html>
