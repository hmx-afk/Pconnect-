<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Requests | PConnect</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
    padding-bottom: 90px;
}

header {
    background: #6c4cff;
    color: white;
    padding: 20px;
}

header a {
    color: white;
    text-decoration: none;
    font-size: 15px;
}

.container {
    max-width: 700px;
    margin: 25px auto;
    padding: 0 18px;
}

h1 {
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 20px;
    line-height: 1.5;
}

.loading,
.empty,
.error {
    background: white;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    color: #666;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.error {
    color: #b42318;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.service-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.request-id {
    color: #777;
    font-size: 13px;
    margin-bottom: 15px;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    margin: 3px 5px 12px 0;
}

.approved {
    background: #dcfce7;
    color: #166534;
}

.rejected {
    background: #fee2e2;
    color: #991b1b;
}

.waiting {
    background: #fff3cd;
    color: #856404;
}

.pending {
    background: #e0e7ff;
    color: #3730a3;
}

.paid {
    background: #dcfce7;
    color: #166534;
}

.progress {
    background: #dbeafe;
    color: #1d4ed8;
}

.completed {
    background: #d1fae5;
    color: #065f46;
}

.cancelled {
    background: #f3f4f6;
    color: #374151;
}

.details {
    color: #555;
    line-height: 1.6;
    margin-top: 8px;
    overflow-wrap: anywhere;
}

.details strong {
    color: #222;
}

.pay-button {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    background: #6c4cff;
    color: white;
    text-align: center;
    text-decoration: none;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.pay-button:hover {
    opacity: 0.9;
}

.refresh-button {
    display: block;
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    background: white;
    color: #6c4cff;
    border: 2px solid #6c4cff;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.refresh-button:disabled {
    opacity: 0.6;
    cursor: wait;
}

nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    display: flex;
    justify-content: space-around;
    padding: 14px 5px;
    box-shadow: 0 -3px 12px rgba(0,0,0,0.08);
    z-index: 1000;
}

nav a {
    text-decoration: none;
    color: #555;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
}

nav a.active {
    color: #6c4cff;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <a href="index.html">← Back to Home</a>
</header>

<main class="container">

    <h1>📋 My Requests</h1>

    <p class="subtitle">
        View your service requests and their current status.
    </p>

    <div id="requestsContainer" aria-live="polite">
        <div class="loading">
            Loading your requests...
        </div>
    </div>

    <button
        id="refreshButton"
        class="refresh-button"
        type="button"
    >
        🔄 Refresh Requests
    </button>

</main>

<nav aria-label="Main navigation">

    <a href="index.html">
        🏠<br>Home
    </a>

    <a href="browse.html">
        🔎<br>Browse
    </a>

    <a href="requests.html" class="active">
        📋<br>Requests
    </a>

    <a href="payments.html">
        💳<br>Payments
    </a>

    <a href="profile.html">
        👤<br>Profile
    </a>

</nav>

<script src="requests.js" defer></script>

</body>
</html>
