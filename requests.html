<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Requests | PConnect</title>

    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            padding-bottom: 90px;
        }

        header {
            background: #6c4cff;
            color: white;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 18px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .loading,
        .empty,
        .error {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            color: #666;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .error {
            color: #b42318;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .service-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .request-id {
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin: 3px 5px 12px 0;
        }

        .approved {
            background: #dcfce7;
            color: #166534;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .waiting {
            background: #fff3cd;
            color: #856404;
        }

        .pending {
            background: #e0e7ff;
            color: #3730a3;
        }

        .paid {
            background: #dcfce7;
            color: #166534;
        }

        .progress {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .completed {
            background: #d1fae5;
            color: #065f46;
        }

        .cancelled {
            background: #f3f4f6;
            color: #374151;
        }

        .details {
            color: #555;
            line-height: 1.6;
            margin-top: 8px;
        }

        .details strong {
            color: #222;
        }

        .pay-button {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            background: #6c4cff;
            color: white;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .pay-button:hover {
            opacity: 0.9;
        }

        .refresh-button {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: white;
            color: #6c4cff;
            border: 2px solid #6c4cff;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 14px 5px;
            box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.08);
            z-index: 1000;
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        nav a.active {
            color: #6c4cff;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <header>
        <a href="index.html">← Back to Home</a>
    </header>

    <div class="container">

        <h1>📋 My Requests</h1>

        <p class="subtitle">
            View your service requests and their current status.
        </p>

        <div id="requestsContainer">
            <div class="loading">
                Loading your requests...
            </div>
        </div>

        <button
            class="refresh-button"
            onclick="loadRequests()"
        >
            🔄 Refresh Requests
        </button>

    </div>

    <nav>

        <a href="index.html">
            🏠<br>Home
        </a>

        <a href="browse.html">
            🔎<br>Browse
        </a>

        <a
            href="requests.html"
            class="active"
        >
            📋<br>Requests
        </a>

        <a href="payments.html">
            💳<br>Payments
        </a>

        <a href="profile.html">
            👤<br>Profile
        </a>

    </nav>

    <script>

        // ==========================================
        // PConnect - My Requests
        // ==========================================

        let piUsername = "";

        // ==========================================
        // Get saved Pi username
        // ==========================================

        function getSavedUsername() {

            const possibleKeys = [
                "pconnect_pi_username",
                "pi_username",
                "piUsername"
            ];

            for (const key of possibleKeys) {

                const value =
                    localStorage.getItem(key);

                if (value && value.trim()) {

                    return value.trim();

                }

            }

            return "";

        }


        // ==========================================
        // Escape HTML
        // ==========================================

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ==========================================
        // Review Status
        // ==========================================

        function reviewStatusClass(status) {

            const value =
                String(status || "")
                    .toLowerCase();

            if (value === "approved") {
                return "approved";
            }

            if (value === "rejected") {
                return "rejected";
            }

            return "waiting";
        }


        // ==========================================
        // Order Status
        // ==========================================

        function orderStatusClass(status) {

            const value =
                String(status || "")
                    .toLowerCase()
                    .replace(/\s+/g, "_");

            if (value === "paid") {
                return "paid";
            }

            if (
                value === "in_progress" ||
                value === "in progress"
            ) {
                return "progress";
            }

            if (value === "completed") {
                return "completed";
            }

            if (value === "cancelled") {
                return "cancelled";
            }

            return "pending";
        }


        // ==========================================
        // Display order status
        // ==========================================

        function getOrderStatus(request) {

            return (
                request.order_status ||
                request.orderStatus ||
                "Pending"
            );

        }


        // ==========================================
        // Load Requests
        // ==========================================

        async function loadRequests() {

            const container =
                document.getElementById(
                    "requestsContainer"
                );

            container.innerHTML = `
                <div class="loading">
                    Loading your requests...
                </div>
            `;

            try {

                piUsername =
                    getSavedUsername();

                // ==================================
                // If username is not saved,
                // try Pi authentication
                // ==================================

                if (!piUsername) {

                    if (
                        typeof Pi !== "undefined"
                    ) {

                        try {

                            Pi.init({
                                version: "2.0",
                                sandbox: true
                            });

                            const auth =
                                await Pi.authenticate(
                                    [
                                        "username"
                                    ],
                                    function(payment) {
                                        console.log(
                                            "Incomplete payment:",
                                            payment
                                        );
                                    }
                                );

                            if (
                                auth &&
                                auth.user &&
                                auth.user.username
                            ) {

                                piUsername =
                                    auth.user.username;

                                localStorage.setItem(
                                    "pconnect_pi_username",
                                    piUsername
                                );

                            }

                        } catch (authError) {

                            console.error(
                                "Pi authentication error:",
                                authError
                            );

                        }

                    }

                }


                // ==================================
                // Username still missing
                // ==================================

                if (!piUsername) {

                    container.innerHTML = `
                        <div class="error">
                            <h3>🔐 Pi Account Required</h3>
                            <p style="margin-top:10px;">
                                Please sign in with Pi to view your requests.
                            </p>
                        </div>
                    `;

                    return;
                }


                // ==================================
                // API request
                // ==================================

                const response =
                    await fetch(
                        "/api/requests?pi_username=" +
                        encodeURIComponent(piUsername),
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.error ||
                        "Failed to load requests"
                    );

                }


                const requests =
                    Array.isArray(result.requests)
                        ? result.requests
                        : [];


                // ==================================
                // No requests
                // ==================================

                if (requests.length === 0) {

                    container.innerHTML = `
                        <div class="empty">
                            <h3>No requests yet</h3>

                            <p style="margin-top:10px;">
                                You have not submitted any service requests.
                            </p>

                            <a
                                href="browse.html"
                                class="pay-button"
                            >
                                🔎 Browse Services
                            </a>
                        </div>
                    `;

                    return;
                }


                // ==================================
                // Render requests
                // ==================================

                container.innerHTML =
                    requests.map(
                        function(request) {

                            const reviewStatus =
                                request.review_status ||
                                "Waiting";

                            const orderStatus =
                                getOrderStatus(
                                    request
                                );

                            const payment =
                                request.payment ||
                                "Pending";

                            const isApproved =
                                String(
                                    reviewStatus
                                ).toLowerCase() ===
                                "approved";

                            const isPaid =
                                String(
                                    orderStatus
                                ).toLowerCase() ===
                                "paid";

                            const isInProgress =
                                String(
                                    orderStatus
                                ).toLowerCase()
                                .replace(/\s+/g, "_") ===
                                "in_progress";

                            const isCompleted =
                                String(
                                    orderStatus
                                ).toLowerCase() ===
                                "completed";

                            const isCancelled =
                                String(
                                    orderStatus
                                ).toLowerCase() ===
                                "cancelled";


                            let action = "";


                            // ==========================
                            // Pay only when:
                            // Approved + Pending
                            // ==========================

                            if (
                                isApproved &&
                                !isPaid &&
                                !isInProgress &&
                                !isCompleted &&
                                !isCancelled
                            ) {

                                action = `
                                    <a
                                        href="payments.html?request_id=${encodeURIComponent(request.id)}"
                                        class="pay-button"
                                    >
                                        💳 Pay 0.01 π
                                    </a>
                                `;

                            }


                            if (isPaid) {

                                action = `
                                    <div
                                        class="status paid"
                                        style="margin-top:15px; margin-bottom:0;"
                                    >
                                        ✅ Paid
                                    </div>
                                `;

                            }


                            if (isInProgress) {

                                action = `
                                    <div
                                        class="status progress"
                                        style="margin-top:15px; margin-bottom:0;"
                                    >
                                        🔵 Order In Progress
                                    </div>
                                `;

                            }


                            if (isCompleted) {

                                action = `
                                    <div
                                        class="status completed"
                                        style="margin-top:15px; margin-bottom:0;"
                                    >
                                        🟢 Completed
                                    </div>
                                `;

                            }


                            if (isCancelled) {

                                action = `
                                    <div
                                        class="status cancelled"
                                        style="margin-top:15px; margin-bottom:0;"
                                    >
                                        ⚪ Cancelled
                                    </div>
                                `;

                            }


                            return `
                                <div class="card">

                                    <div class="service-title">
                                        💻
                                        ${escapeHtml(
                                            request.service ||
                                            "Service"
                                        )}
                                    </div>

                                    <div class="request-id">
                                        Request ID:
                                        <strong>
                                            #${escapeHtml(
                                                request.id
                                            )}
                                        </strong>
                                    </div>

                                    <div>

                                        <span
                                            class="status ${reviewStatusClass(
                                                reviewStatus
                                            )}"
                                        >
                                            Review:
                                            ${escapeHtml(
                                                reviewStatus
                                            )}
                                        </span>

                                        <span
                                            class="status ${orderStatusClass(
                                                orderStatus
                                            )}"
                                        >
                                            Order:
                                            ${escapeHtml(
                                                orderStatus
                                            )}
                                        </span>

                                    </div>

                                    <p class="details">

                                        <strong>Name:</strong>
                                        ${escapeHtml(
                                            request.name
                                        )}
                                        <br><br>

                                        <strong>Contact:</strong>
                                        ${escapeHtml(
                                            request.contact
                                        )}
                                        <br><br>

                                        <strong>Project Details:</strong>
                                        ${escapeHtml(
                                            request.details
                                        )}
                                        <br><br>

                                        <strong>Payment:</strong>
                                        ${escapeHtml(
                                            payment
                                        )}
                                        <br><br>

                                        <strong>Submitted:</strong>
                                        ${escapeHtml(
                                            request.created_at
                                                ? new Date(
                                                    request.created_at
                                                ).toLocaleString()
                                                : "N/A"
                                        )}

                                    </p>

                                    ${action}

                                </div>
                            `;

                        }
                    ).join("");


            } catch (error) {

                console.error(
                    "Load requests error:",
                    error
                );

                container.innerHTML = `
                    <div class="error">

                        <h3>
                            ⚠️ Failed to Load Requests
                        </h3>

                        <p style="margin-top:10px;">
                            ${
                                escapeHtml(
                                    error.message ||
                                    "Please try again."
                                )
                            }
                        </p>

                    </div>
                `;

            }

        }


        // ==========================================
        // Start
        // ==========================================

        loadRequests();

    </script>

</body>

</html>
