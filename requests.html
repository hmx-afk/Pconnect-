<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Requests | PiConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            padding-bottom: 80px;
        }

        header {
            background: #6c4cff;
            color: white;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 18px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .service-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .details {
            color: #555;
            line-height: 1.6;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            color: #666;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 14px 5px;
            box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.08);
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html">← Back to Home</a>
    </header>

    <div class="container">

        <h1>📋 My Requests</h1>

        <p class="subtitle">
            View your service requests and their current status.
        </p>

        <div id="requestsContainer"></div>

    </div>

    <nav>

        <a href="index.html">
            🏠<br>Home
        </a>

        <a href="browse.html">
            🔎<br>Browse
        </a>

        <a href="requests.html">
            📝<br>My Requests
        </a>

        <a href="#">
            💳<br>Payments
        </a>

        <a href="#">
            👤<br>Profile
        </a>

    </nav>

    <script>

        function loadRequests() {

            const container =
                document.getElementById("requestsContainer");

            const savedRequest =
                localStorage.getItem("piconnect_request");

            if (!savedRequest) {

                container.innerHTML = `
                    <div class="empty">
                        <h3>No requests yet</h3>
                        <p>
                            You have not submitted any service requests.
                        </p>
                    </div>
                `;

                return;
            }

            const request =
                JSON.parse(savedRequest);

            container.innerHTML = `

                <div class="card">

                    <div class="service-title">
                        💻 ${request.service}
                    </div>

                    <div class="status">
                        ${request.status}
                    </div>

                    <p class="details">

                        <strong>Name:</strong>
                        ${request.name}
                        <br><br>

                        <strong>Contact:</strong>
                        ${request.contact}
                        <br><br>

                        <strong>Project Details:</strong>
                        ${request.details}
                        <br><br>

                        <strong>Payment:</strong>
                        ${request.payment}
                        <br><br>

                        <strong>Status:</strong>
                        ${request.reviewStatus}
                        <br><br>

                        <strong>Submitted:</strong>
                        ${request.createdAt}

                    </p>

                </div>
            `;
        }

        loadRequests();

    </script>

</body>

</html>
