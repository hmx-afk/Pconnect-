<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PConnect Security Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #120b1f;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #211334;
            padding: 25px;
            border-radius: 16px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #cfc5d9;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #7c4dff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        pre {
            margin-top: 20px;
            padding: 15px;
            background: #0b0710;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .warning {
            color: #ffc857;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>🔒 PConnect Security Test</h1>

        <p>
            Testing Request #35.
        </p>

        <p class="warning">
            This test does NOT make a Pi payment
            and does NOT modify the request.
        </p>

        <button id="testBtn">
            Test Request #35
        </button>

        <pre id="result">Waiting for test...</pre>

    </div>


    <script>

        const testBtn =
            document.getElementById("testBtn");

        const result =
            document.getElementById("result");


        testBtn.addEventListener(
            "click",
            async function () {

                testBtn.disabled = true;

                result.textContent =
                    "Testing Request #35...";


                try {

                    const response =
                        await fetch(
                            "/api/security-test",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    request_id: 35
                                })
                            }
                        );


                    const data =
                        await response.json();


                    result.textContent =
                        JSON.stringify(
                            data,
                            null,
                            2
                        );


                } catch (error) {

                    console.error(
                        "Security test error:",
                        error
                    );

                    result.textContent =
                        "Test failed:\n\n" +
                        error.message;

                }


                testBtn.disabled = false;

            }
        );

    </script>

</body>

</html>
